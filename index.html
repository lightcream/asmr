<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奖励系统 - 媒体与字幕学习器</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg-color: #121212;
            --panel-bg: rgba(30, 30, 30, 0.95);
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 媒体展示区 */
        .media-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        .subtitle-display {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 24px;
            text-align: center;
            line-height: 1.5;
            max-width: 80%;
            display: none;
            text-shadow: 1px 1px 2px black;
            transition: all 0.3s ease;
        }

        /* 控制面板 */
        .control-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--panel-bg);
            padding: 20px;
            border-top: 1px solid #333;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .control-panel.hidden {
            transform: translateY(100%);
        }

        /* 隐藏时的极简进度条 */
        .thin-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #333;
            cursor: pointer;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .control-panel.hidden ~ .thin-progress-bar {
            opacity: 1;
            pointer-events: auto;
        }

        .thin-progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            position: relative;
        }

        .percent-indicator {
            position: absolute;
            right: 0;
            bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 4px;
            transform: translateX(50%);
        }

        /* 面板内部布局 */
        .panel-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            gap: 15px;
        }
        
        .panel-row:last-child {
            margin-bottom: 0;
        }

        /* 输入与按钮 */
        .file-upload-group {
            display: flex;
            gap: 15px;
        }

        .file-label {
            background: #333;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .file-label:hover {
            background: #444;
        }

        input[type="file"] {
            display: none;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        
        button:hover { background: #357abd; }
        button.toggle-btn { background: #444; }
        button.toggle-btn:hover { background: #555; }

        /* 滑块定制 */
        input[type="range"] {
            -webkit-appearance: none;
            width: 150px;
            height: 6px;
            background: #444;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-slider {
            width: 100% !important;
        }

        .time-display {
            font-size: 14px;
            color: var(--text-muted);
            min-width: 100px;
            text-align: right;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .number-input {
            width: 50px;
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
        }

    </style>
</head>
<body>

    <div class="media-container">
        <video id="mediaPlayer" playsinline></video>
        <div class="subtitle-display" id="subDisplay">请上传资源文件</div>
    </div>

    <div class="control-panel" id="controlPanel">
        <div class="panel-row">
            <div class="file-upload-group">
                <label class="file-label">
                    📁 上传音视频资源
                    <input type="file" id="mediaUpload" accept="audio/*, video/*">
                </label>
                <label class="file-label">
                    📝 上传字幕 (可选 JSON/LRC/VTT)
                    <input type="file" id="subUpload" accept=".json, .lrc, .vtt">
                </label>
            </div>
            <button class="toggle-btn" id="hidePanelBtn">隐藏面板 ↓</button>
        </div>

        <div class="panel-row">
            <button id="playPauseBtn">▶ 播放</button>
            <div class="progress-container">
                <input type="range" id="progressBar" class="progress-slider" min="0" max="100" value="0" step="0.01">
                <div class="time-display" id="timeDisplay">00:00 / 00:00</div>
            </div>
        </div>

        <div class="panel-row" style="justify-content: flex-start; gap: 30px;">
            <div class="setting-item">
                🔊 音量: 
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
            </div>
            <div class="setting-item">
                ⚡ 速度: 
                <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
                <input type="number" id="speedInput" class="number-input" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="setting-item">
                <span id="statusText" style="color: var(--text-muted);">状态：就绪</span>
            </div>
        </div>
    </div>

    <div class="thin-progress-bar" id="thinProgressBar">
        <div class="thin-progress-fill" id="thinProgressFill">
            <div class="percent-indicator" id="percentDisplay">0.0%</div>
        </div>
    </div>

    <script>
        // DOM 元素绑定
        const mediaPlayer = document.getElementById('mediaPlayer');
        const mediaUpload = document.getElementById('mediaUpload');
        const subUpload = document.getElementById('subUpload');
        const subDisplay = document.getElementById('subDisplay');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeSlider = document.getElementById('volumeSlider');
        const speedSlider = document.getElementById('speedSlider');
        const speedInput = document.getElementById('speedInput');
        const controlPanel = document.getElementById('controlPanel');
        const hidePanelBtn = document.getElementById('hidePanelBtn');
        const thinProgressBar = document.getElementById('thinProgressBar');
        const thinProgressFill = document.getElementById('thinProgressFill');
        const percentDisplay = document.getElementById('percentDisplay');
        const statusText = document.getElementById('statusText');

        // 核心状态数据
        let subtitles = [];
        let currentSubIndex = -1;
        
        // 播放引擎状态机： 'IDLE' | 'TTS' | 'MEDIA'
        let playState = 'IDLE'; 
        let isUserSeeking = false;
        let isPlayingFlag = false;

        // 动画变量
        let currentDisplayPercent = 0;
        let targetPercent = 0;
        let animFrameId = null;

        // 初始化
        mediaPlayer.volume = 1;
        const synth = window.speechSynthesis;
        let ttsUtterance = null;

        // ==========================================
        // 1. 文件处理与解析
        // ==========================================

        mediaUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            mediaPlayer.src = url;
            resetState();
            subDisplay.style.display = 'block';
            subDisplay.textContent = "资源已加载，准备播放";
        });

        subUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const ext = file.name.split('.').pop().toLowerCase();
                try {
                    if (ext === 'json') parseJSON(text);
                    else if (ext === 'lrc') parseLRC(text);
                    else if (ext === 'vtt') parseVTT(text);
                    else alert("不支持的字幕格式！");
                    
                    if (subtitles.length > 0) {
                        subDisplay.textContent = `已加载 ${subtitles.length} 条字幕`;
                    }
                } catch (err) {
                    alert("字幕解析失败: " + err.message);
                }
            };
            reader.readAsText(file);
        });

        // 解析 JSON
        function parseJSON(text) {
            const data = JSON.parse(text);
            subtitles = data.map(item => ({
                start: parseFloat(item.from),
                end: parseFloat(item.to),
                text: item.content
            })).sort((a, b) => a.start - b.start);
        }

        // 解析 LRC
        function parseLRC(text) {
            const lines = text.split('\n');
            const regex = /\[(\d{2}):(\d{2}\.\d{2,3})\](.*)/;
            subtitles = [];
            lines.forEach(line => {
                const match = line.match(regex);
                if (match) {
                    const start = parseInt(match[1]) * 60 + parseFloat(match[2]);
                    const content = match[3].trim();
                    if (content) {
                        subtitles.push({ start: start, text: content });
                    }
                }
            });
            // 推断 LRC 的 end time
            for (let i = 0; i < subtitles.length - 1; i++) {
                subtitles[i].end = subtitles[i + 1].start;
            }
            if (subtitles.length > 0) {
                subtitles[subtitles.length - 1].end = subtitles[subtitles.length - 1].start + 10; // 最后一句默认10秒
            }
        }

        // 解析 VTT
        function parseVTT(text) {
            const lines = text.split('\n');
            subtitles = [];
            const timeRegex = /(?:(\d{2}):)?(\d{2}):(\d{2}\.\d{3})\s*-->\s*(?:(\d{2}):)?(\d{2}):(\d{2}\.\d{3})/;
            
            for (let i = 0; i < lines.length; i++) {
                const match = lines[i].match(timeRegex);
                if (match) {
                    const start = (parseInt(match[1]||0) * 3600) + (parseInt(match[2]) * 60) + parseFloat(match[3]);
                    const end = (parseInt(match[4]||0) * 3600) + (parseInt(match[5]) * 60) + parseFloat(match[6]);
                    
                    let textLines = [];
                    let j = i + 1;
                    while (j < lines.length && lines[j].trim() !== "" && !lines[j].match(timeRegex) && !lines[j].includes('-->')) {
                        textLines.push(lines[j].trim());
                        j++;
                    }
                    if(textLines.length > 0) {
                        subtitles.push({ start, end, text: textLines.join(' ') });
                    }
                }
            }
        }

        // ==========================================
        // 2. 核心状态机与调度
        // ==========================================

        function resetState() {
            synth.cancel();
            playState = 'IDLE';
            isPlayingFlag = false;
            currentSubIndex = -1;
            mediaPlayer.pause();
            mediaPlayer.currentTime = 0;
            updatePlayBtn();
            statusText.textContent = "状态：就绪";
        }

        // 主播放调度函数
        function stepSchedule() {
            if (!isPlayingFlag) return;

            // 1. 无字幕模式，直接播放视频
            if (subtitles.length === 0) {
                playState = 'MEDIA';
                mediaPlayer.play();
                statusText.textContent = "状态：原生播放";
                return;
            }

            // 2. 检查越界
            if (currentSubIndex >= subtitles.length) {
                isPlayingFlag = false;
                playState = 'IDLE';
                updatePlayBtn();
                statusText.textContent = "状态：播放结束";
                return;
            }

            // 校准索引防越界
            if(currentSubIndex < 0) currentSubIndex = 0;
            
            const currentSub = subtitles[currentSubIndex];
            subDisplay.textContent = currentSub.text;

            // 如果当前时间已经超过了该句的结束时间（多发生于随意拖动进度条之后），则跳到下一句
            if (mediaPlayer.currentTime >= currentSub.end) {
                currentSubIndex++;
                stepSchedule();
                return;
            }

            // 3. 执行 TTS 朗读
            playState = 'TTS';
            mediaPlayer.pause();
            statusText.textContent = "状态：正在朗读";
            
            synth.cancel(); // 终止之前的语音
            ttsUtterance = new SpeechSynthesisUtterance(currentSub.text);
            ttsUtterance.lang = 'zh-CN';
            // TTS 的语速尽量不被大幅度魔改，保持清晰，但也可映射
            ttsUtterance.rate = Math.min(parseFloat(speedInput.value), 1.5); 
            
            ttsUtterance.onend = () => {
                // 如果用户在中途点击了暂停或者拖动了进度条，状态机发生改变，则中止后续的媒体播放
                if (playState !== 'TTS' || !isPlayingFlag) return;
                
                // 4. TTS 完毕，播放对应的媒体片段
                playState = 'MEDIA';
                statusText.textContent = "状态：正在播放原文";
                // 确保对准该句话的起点
                if(Math.abs(mediaPlayer.currentTime - currentSub.start) > 0.5) {
                   mediaPlayer.currentTime = currentSub.start; 
                }
                mediaPlayer.play();
            };

            ttsUtterance.onerror = (e) => {
                console.warn("TTS Error:", e);
                // 出错直接跳过TTS播原音
                if (playState === 'TTS' && isPlayingFlag) {
                    playState = 'MEDIA';
                    mediaPlayer.currentTime = currentSub.start;
                    mediaPlayer.play();
                }
            };

            synth.speak(ttsUtterance);
        }

        // ==========================================
        // 3. 媒体监听与控件交互
        // ==========================================

        // 监听视频播放，当到达字幕 end 时间点时，截断视频并触发下一句
        mediaPlayer.addEventListener('timeupdate', () => {
            if (isUserSeeking) return;
            
            updateProgressUI();

            if (playState === 'MEDIA' && subtitles.length > 0 && isPlayingFlag) {
                const currentSub = subtitles[currentSubIndex];
                if (currentSub && mediaPlayer.currentTime >= currentSub.end) {
                    mediaPlayer.pause();
                    currentSubIndex++;
                    stepSchedule(); // 循环执行下一步
                }
            }
        });

        mediaPlayer.addEventListener('loadedmetadata', () => {
            progressBar.max = mediaPlayer.duration;
            updateTimeDisplay();
        });

        mediaPlayer.addEventListener('ended', () => {
            isPlayingFlag = false;
            playState = 'IDLE';
            updatePlayBtn();
        });

        // 播放/暂停 按钮
        playPauseBtn.addEventListener('click', () => {
            if (isPlayingFlag) {
                // 触发暂停
                isPlayingFlag = false;
                synth.cancel();
                mediaPlayer.pause();
                playState = 'IDLE';
                statusText.textContent = "状态：已暂停";
            } else {
                // 触发播放
                isPlayingFlag = true;
                
                // 确定起始索引
                if (subtitles.length > 0 && currentSubIndex === -1) {
                    currentSubIndex = findSubIndexByTime(mediaPlayer.currentTime);
                }
                stepSchedule();
            }
            updatePlayBtn();
        });

        function updatePlayBtn() {
            playPauseBtn.textContent = isPlayingFlag ? '⏸ 暂停' : '▶ 播放';
        }

        // 查找时间点对应的字幕索引
        function findSubIndexByTime(time) {
            if(subtitles.length === 0) return 0;
            // 精确查找当前区间
            let index = subtitles.findIndex(s => time >= s.start && time < s.end);
            if (index !== -1) return index;
            // 若在空白期，找到下一句
            index = subtitles.findIndex(s => s.start >= time);
            if (index !== -1) return index;
            // 若超出了最后一句
            return subtitles.length - 1;
        }

        // 进度条拖拽核心逻辑（确保无Bug）
        progressBar.addEventListener('mousedown', () => isUserSeeking = true);
        progressBar.addEventListener('input', () => {
            mediaPlayer.currentTime = progressBar.value;
            updateTimeDisplay();
            targetPercent = (mediaPlayer.currentTime / mediaPlayer.duration) * 100; // 更新细线进度
        });
        
        progressBar.addEventListener('mouseup', () => {
            isUserSeeking = false;
            handleSeekAction(progressBar.value);
        });
        progressBar.addEventListener('change', () => { // 兼容部分浏览器的直接点击
            if(!isUserSeeking) handleSeekAction(progressBar.value);
        });

        // 细线进度条点击支持
        thinProgressBar.addEventListener('click', (e) => {
            if(!mediaPlayer.duration) return;
            const rect = thinProgressBar.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            const newTime = percentage * mediaPlayer.duration;
            mediaPlayer.currentTime = newTime;
            handleSeekAction(newTime);
        });

        function handleSeekAction(timeValue) {
            synth.cancel(); // 立即打断 TTS
            playState = 'IDLE';
            
            if (subtitles.length > 0) {
                currentSubIndex = findSubIndexByTime(timeValue);
                // 让UI显示当前拖动到的字幕
                if(subtitles[currentSubIndex]){
                    subDisplay.textContent = subtitles[currentSubIndex].text;
                }
            }

            if (isPlayingFlag) {
                // 如果正在播放中拖动，拖动完毕后自动恢复调度逻辑
                stepSchedule();
            }
        }

        // ==========================================
        // 4. 其他参数控制 (音量、速度)
        // ==========================================

        volumeSlider.addEventListener('input', (e) => {
            mediaPlayer.volume = e.target.value;
        });

        function syncSpeed(val) {
            let speed = parseFloat(val);
            if(isNaN(speed)) return;
            if(speed < 0.1) speed = 0.1;
            if(speed > 5) speed = 5;
            mediaPlayer.playbackRate = speed;
            speedSlider.value = speed;
            speedInput.value = speed;
        }

        speedSlider.addEventListener('input', (e) => syncSpeed(e.target.value));
        speedInput.addEventListener('change', (e) => syncSpeed(e.target.value));

        // ==========================================
        // 5. UI更新与动画
        // ==========================================

        function formatTime(sec) {
            if(isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimeDisplay() {
            timeDisplay.textContent = `${formatTime(mediaPlayer.currentTime)} / ${formatTime(mediaPlayer.duration)}`;
        }

        function updateProgressUI() {
            if(!mediaPlayer.duration) return;
            progressBar.value = mediaPlayer.currentTime;
            updateTimeDisplay();
            // 设定目标百分比供动画读取
            targetPercent = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
        }

        // 面板隐藏切换
        hidePanelBtn.addEventListener('click', () => {
            controlPanel.classList.toggle('hidden');
        });

        // 百分比平滑上涨动画逻辑 (requestAnimationFrame 插值)
        function animatePercent() {
            if (mediaPlayer.duration) {
                // 缓动算法 (Ease-out)
                const diff = targetPercent - currentDisplayPercent;
                // 如果差异很小，直接对齐
                if (Math.abs(diff) < 0.05) {
                    currentDisplayPercent = targetPercent;
                } else {
                    currentDisplayPercent += diff * 0.2; // 0.2 是插值系数，控制平滑度
                }
                
                thinProgressFill.style.width = currentDisplayPercent + '%';
                percentDisplay.textContent = currentDisplayPercent.toFixed(1) + '%';
            }
            animFrameId = requestAnimationFrame(animatePercent);
        }
        
        // 启动动画循环
        animatePercent();

    </script>
</body>
</html>
